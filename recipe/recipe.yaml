schema_version: 1

context:
  name: gitea
  version: "28.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/go-gitea/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: c2060e8ccf89c07764f834d2e96a3fdbd3d2f203cd49b99415ab1fd827192e56

build:
  # Can't currently build on Windows, but config is kept so we can try again in future
  number: 1
  skip: win

requirements:
  build:
    - ${{ compiler('cgo') }} 1.27.*
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: not win
      then: file
    - go-licenses
    - make
    - nodejs >=20
    - pnpm
    # Makefile uses some unix bash commands
    - if: win
      then: m2-filesystem
    - if: win
      then: m2-bash
    - if: win
      then: m2-base
    - if: win
      then: m2-grep
    - if: win
      then: m2-sed
  run:
    - git

tests:
  - script:
      - gitea --version
      - gitea --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Git with a cup of tea
  description: |
    The goal of this project is to make the easiest, fastest, and most
    painless way of setting up a self-hosted Git service.
  homepage: https://about.gitea.com
  repository: https://github.com/go-gitea/gitea
  documentation: https://docs.gitea.com

extra:
  recipe-maintainers:
    - manics
    - nehaljwani
    - techknowlogick
